# Background effects (script files are served locally through hexo-butterfly-extjs)
# Reference settings from https://bistutzyy.github.io (Butterfly 5.5.4); only mobile is off by choice.
canvas_nest:
  enable: true
  color: '0,0,255'
  opacity: 0.7
  zIndex: -1
  count: 99
  mobile: false
canvas_ribbon:
  enable: true
  size: 150
  alpha: 0.6
  zIndex: -1
  click_to_change: false
  mobile: false
