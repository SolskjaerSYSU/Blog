    button:
      enable: true
      icon: fab fa-github
      text: GitHub
      link: https://github.com/SolskjaerSYSU
  card_announcement:
    enable: true
    content: 欢迎来到我的博客！这里收藏学习笔记、创作与生活的片段。
  card_webinfo:
    runtime_date: 4/18/2026 00:00:00
